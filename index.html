<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Armory</title>

    <link rel="stylesheet" href="armory.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:
            radial-gradient(circle at top, rgba(244,67,54,0.15), transparent 35%),
            radial-gradient(circle at bottom, rgba(33,150,243,0.12), transparent 35%),
            #111;
            color:white;
            min-height:100vh;
            overflow-x:hidden;
        }

        header{
            position:relative;
            text-align:center;
            padding:80px 20px;
            background:
            linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(17,17,17,0.95)),
            url('https://images.unsplash.com/photo-1511884642898-4c92249e20b6?q=80&w=1600&auto=format&fit=crop');
            background-size:cover;
            background-position:center;
            border-bottom:2px solid rgba(255,255,255,0.1);
            box-shadow:0 5px 20px rgba(0,0,0,0.5);
        }

        header::after{
            content:'';
            position:absolute;
            inset:0;
            background:rgba(0,0,0,0.45);
        }

        header h1,
        header p{
            position:relative;
            z-index:1;
        }

        header h1{
            font-size:4rem;
            color:#ff4b3e;
            letter-spacing:4px;
            text-transform:uppercase;
            text-shadow:0 0 20px rgba(255,75,62,0.6);
            margin-bottom:15px;
        }

        header p{
            font-size:1.2rem;
            color:#dddddd;
        }

        .container{
            max-width:1200px;
            margin:auto;
            padding:70px 20px;
            text-align:center;
        }

        .container h2{
            font-size:2.5rem;
            margin-bottom:50px;
            color:#f5f5f5;
            position:relative;
        }

        .container h2::after{
            content:'';
            width:120px;
            height:4px;
            background:#ff9800;
            display:block;
            margin:15px auto 0;
            border-radius:10px;
        }

        .category-section{
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(220px,1fr));
            gap:30px;
        }

        .category-link{
            text-decoration:none;
        }

        .button{
            position:relative;
            overflow:hidden;
            padding:30px 20px;
            border-radius:18px;
            color:white;
            font-size:1.3rem;
            font-weight:bold;
            letter-spacing:1px;
            transition:0.35s ease;
            backdrop-filter:blur(8px);
            border:1px solid rgba(255,255,255,0.08);
            box-shadow:
            0 10px 20px rgba(0,0,0,0.35),
            inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .button::before{
            content:'';
            position:absolute;
            top:-50%;
            left:-50%;
            width:200%;
            height:200%;
            background:linear-gradient(
                120deg,
                transparent,
                rgba(255,255,255,0.12),
                transparent
            );
            transform:rotate(25deg);
            transition:0.6s;
        }

        .button:hover::before{
            left:100%;
        }

        .button:hover{
            transform:translateY(-8px) scale(1.04);
            box-shadow:
            0 15px 30px rgba(0,0,0,0.55),
            0 0 20px rgba(255,255,255,0.12);
        }

        #rifles{ background:linear-gradient(135deg,#2e7d32,#4caf50); }
        #smg{ background:linear-gradient(135deg,#1565c0,#2196f3); }
        #pistols{ background:linear-gradient(135deg,#ef6c00,#ff9800); }
        #shotguns{ background:linear-gradient(135deg,#6a1b9a,#9c27b0); }
        #sniper{ background:linear-gradient(135deg,#b71c1c,#f44336); }

        footer{
            text-align:center;
            padding:30px;
            color:#888;
            border-top:1px solid rgba(255,255,255,0.08);
            background:#0f0f0f;
            margin-top:70px;
        }

        @media(max-width:768px){
            header{ padding:60px 20px; }
            header h1{ font-size:2.5rem; }
            .container h2{ font-size:2rem; }
            .button{ font-size:1.1rem; padding:24px 18px; }
        }
    </style>
</head>

<body>

    <header>
        <h1>The Armory</h1>
        <p>Weapon Specifications • Reviews • History</p>
    </header>

    <main class="container">

        <h2>Weapon Categories</h2>

        <nav class="category-section">

            <a class="category-link" href="rifles.html">
                <div class="button" id="rifles">Rifles</div>
            </a>

            <a class="category-link" href="smg.html">
                <div class="button" id="smg">SMG</div>
            </a>

            <a class="category-link" href="pistols.html">
                <div class="button" id="pistols">Pistols</div>
            </a>

            <a class="category-link" href="shotguns.html">
                <div class="button" id="shotguns">Shotguns</div>
            </a>

            <a class="category-link" href="sniper.html">
                <div class="button" id="sniper">Snipers</div>
            </a>

        </nav>

    </main>

    <footer>
        © 2026 The Armory • Tactical Weapon Archive
    </footer>

    <!-- ✅ THIS IS WHERE YOUR JS GOES -->
    <script src="armory.js"></script>

</body>
</html>
